# Tap2Chef: an offline-first app. Every route is the app; the files that say
# which version is current are never cached, the hashed ones are kept for good.
server {
    server_name tap2chef.devamhatre.com;
    root /var/www/tap2chef;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tap2chef.devamhatre.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tap2chef.devamhatre.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

server {
    if ($host = tap2chef.devamhatre.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name tap2chef.devamhatre.com;
    return 404; # managed by Certbot


}
