name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (lint & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test

  client:
    name: Client (typecheck, lint, test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Keep the build for deploy
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: client/dist
          include-hidden-files: true
          retention-days: 7

  # Only what passed every check goes live. The built app is published as the
  # `site` branch (one fresh commit each time); the VPS checks that branch
  # every few minutes and installs a new build. No keys anywhere: this job
  # uses GitHub's own token, the server only reads a public repo.
  deploy:
    name: Publish site
    needs: [server, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Push to the site branch
        working-directory: site
        run: |
          test -f index.html
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: built app from main ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site

  # The API goes out the same way: what passed is published as the `api`
  # branch (server code and lockfile, no tests), and the VPS installs it.
  deploy-api:
    name: Publish API
    needs: [server, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-api
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Push to the api branch
        run: |
          mkdir api
          cp -r server/. api/
          rm -rf api/tests api/node_modules api/jest.config.js api/.env
          cp .nvmrc api/
          test -f api/index.js
          cd api
          git init -q -b api
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "api: server from main ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" api
